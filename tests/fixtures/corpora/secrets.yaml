version: 1

normalization:
  ignored_headers:
    - set-cookie

cases:
  - id: session
    description: response carries a secret cookie header and secret body token
    method: GET
    path: /api/session

  - id: private-authed
    description: request carries Authorization + X-Api-Key secrets
    method: GET
    path: /api/private
    headers:
      Authorization: "Bearer hunter2"
      X-Api-Key: "secret-key-123"
